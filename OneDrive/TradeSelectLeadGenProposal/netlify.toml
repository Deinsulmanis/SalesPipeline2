[build]
  publish = "."

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control          = "no-cache, no-store, must-revalidate"
    X-Robots-Tag           = "noindex, nofollow"
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
